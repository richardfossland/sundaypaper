# Build, (optionally sign,) and publish SundayPaper for macOS + Windows on a
# version tag. Mirrors SundayStage's / SundayEdit's release flow.
#
# Cut a release:   npm version <patch|minor|major>   (bumps package.json)
#                  # bump src-tauri/tauri.conf.json "version" to match
#                  git tag vX.Y.Z && git push origin vX.Y.Z
#
# The tag push triggers this workflow, which produces a DRAFT GitHub Release
# with the installers + the updater `latest.json`. Review the draft, then
# publish it — installed apps pick up the update from the `latest` release
# endpoint configured in tauri.conf.json.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD) are required (updater
# artifacts). The APPLE_* secrets are optional — without them the macOS build
# is unsigned (fine for internal testing; Gatekeeper needs a right-click→Open).
# See docs/DISTRIBUTION.md.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon (arm64). Universal/Intel is a
          # follow-up (needs a universal target + matching deps).
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Pinned: a floating stable + `-D warnings` turns any newly-added clippy lint into a red main. Bump deliberately.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Cache cargo (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # ── Releasenotatet, HENTET FRA REPOET ──────────────────────────────
      # `releaseBody` blir `notes`-feltet i `latest.json`, og det feltet er
      # teksten brukeren leser i oppdateringsdialogen. tauri-action skriver det
      # ved BYGGETID, så en tekst noen skriver på GitHub etterpå når aldri
      # manifestet — og dermed aldri brukeren. Da dette var en fast setning her
      # i fila, fikk både v0.2.1 og v0.2.2 nøyaktig samme notat.
      #
      # Notatet bor derfor i `docs/release-notes/<tagg>.md` og blir reviewet i
      # samme PR som versjonsbumpen. Skriptet AVBRYTER jobben hvis fila mangler,
      # er tom eller står med en plassholder: en stille tilbakefall-tekst er
      # nøyaktig feilen vi fikser, bare vanskeligere å oppdage.
      #
      # Den egentlige vakten ligger i `check`-jobben i ci.yml, som stopper PR-en
      # før noen har begynt å bygge. Dette steget er den andre låsen på samme
      # dør — den som fortsatt holder når en tagg dyttes fra en gammel commit.
      - name: Hent releasenotatet for taggen
        id: notat
        shell: bash
        run: node scripts/release-notes.mjs --emit "$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Updater signing (required for updater artifacts) ─────────────
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── macOS code signing + notarization ───────────────────────────
          # Disabled until the Apple secrets exist: an *empty* APPLE_CERTIFICATE
          # makes tauri-action run `security import` and FAIL the macOS job. With
          # these omitted the mac build is simply unsigned (right-click → Open the
          # first time). Re-enable by adding the secrets + uncommenting.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SundayPaper ${{ github.ref_name }}"
          # Fra `docs/release-notes/<tagg>.md`, ikke fra denne fila. Se steget
          # over for hvorfor. Vil du ha den lange versjonen med bilder og
          # tabeller på selve utgivelsessiden, rediger utgivelsesteksten på
          # GitHub etterpå — `latest.json` er da allerede lastet opp med
          # notatet herfra.
          releaseBody: ${{ steps.notat.outputs.notes }}
          releaseDraft: true
          prerelease: false
          # Det riktige navnet er `uploadUpdaterJson`. `includeUpdaterJson`
          # finnes ikke som input i tauri-action og ble stille ignorert —
          # `latest.json` ble bare lastet opp fordi `uploadUpdaterJson` er true
          # som standard. Samme felle som SundayStage og SundaySync har
          # dokumentert; her rettet, så navnet betyr det det ser ut som.
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
